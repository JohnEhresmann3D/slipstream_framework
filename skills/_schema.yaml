# Skill Definition Schema
# Skills live in skills/<category>/<name>.yaml. `slipstream validate` enforces
# the required fields; files starting with "_" are ignored.

schema_version: "2.0"

required_fields:
  - name          # Must match the file name (without .yaml)
  - description   # One or two sentences; shown when the skill is available but not enforced

optional_fields:
  - category             # Defaults to the directory name
  - version
  - allows               # Actions the skill permits
  - prohibits            # Actions the skill forbids
  - requires_inputs
  - optional_inputs
  - produces             # Outputs the skill is expected to produce
  - output_requirements  # Checkable requirements on those outputs
  - depends_on
  - failure_conditions   # When to stop and escalate
  - failure_response     # {action, require_hitl}
  - hitl                 # {required_for: [...]} actions that need human approval
  - notes

# How skills reach the model:
# - Skills listed in a workflow phase's `skills_enforced` are rendered in full
#   (allows, prohibits, output_requirements, failure_conditions, hitl).
# - The active persona's other skills appear as one-line descriptions.
# Preview what an agent sees with:
#   slipstream prompt --workflow standard --phase execution

example:
  name: example_skill
  category: core
  version: v1.0
  description: Does example things carefully.
  allows:
    - do_the_thing
  prohibits:
    - skip_verification
  produces:
    - example_report
  output_requirements:
    - Report lists every assumption
  failure_conditions:
    - Inputs are ambiguous
  hitl:
    required_for:
      - Irreversible changes

categories:
  core: "Always-available foundational skills"
  quality: "Quality assurance and verification skills"
  domain: "Project-specific or specialized skills"

# When skills conflict, resolve in this order:
precedence:
  - "Safety/Security"
  - "Correctness/Verification"
  - "Maintainability"
  - "Speed/Convenience"
