# Slipstream project configuration
#
# `slipstream validate` checks this file and everything it points to.
# Agent backends and models are chosen per run on the command line
# (`--backend pi --backend-model openai-codex/gpt-6-astra`), not here, so the
# same project works with any provider.

version: "1.1"
name: "Slipstream Framework"

paths:
  personas: "./personas"
  skills:
    core: "./skills/core"
    quality: "./skills/quality"
    domain: "./skills/domain"
  workflows: "./workflows"
  tools: "./tools"
  constitution_roles: "./constitution/roles"

# The primary constitution is injected into every agent prompt, ahead of the
# persona's role constitution (personas/<id>.yaml -> constitution.role).
# Precedence: primary constitution > role constitution > skill rules.
constitution:
  primary:
    path: "./constitution/AI_Engineer_Constitution.md"

defaults:
  workflow: "standard"
  personas:
    - producer
    - gameplay_engineer
